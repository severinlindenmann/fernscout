# Set FERNSCOUT_HOSTNET=1 in compose.env too, so job.sh uses this file.
# Override for a host whose firewall blocks routed traffic from containers
# (ufw's default `deny (routed)`), so containers on a bridge network have no
# DNS and no internet. App and database share the host's network instead and
# listen on 127.0.0.1 only; the firewall's inbound rules still apply.
#
#   docker compose -f deploy/container/compose.yaml -f deploy/container/compose.hostnet.yaml \
#     --env-file /etc/fernscout/compose.env up -d
#
# Each instance needs its own FERNSCOUT_HOST_PORT and FERNSCOUT_DB_PORT, and
# DATABASE_URL in its env file points at 127.0.0.1:<FERNSCOUT_DB_PORT>.
# Drop this file once routed traffic from the container networks is allowed.
services:
  app:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      BIND_HOST: 127.0.0.1
      PORT: ${FERNSCOUT_HOST_PORT:-3000}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT}/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - ${PRINT_ICC_PROFILE_FILE:-/etc/fernscout/cmyk-swop.icc}:/etc/fernscout/cmyk-swop.icc:ro
  db:
    network_mode: host
    networks: !reset []
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=${FERNSCOUT_DB_PORT:-5432}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${FERNSCOUT_DB_PORT:-5432} -U fernscout -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
