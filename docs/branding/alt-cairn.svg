<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96">
  <title>Fernscout — alternate direction: cairn (not chosen)</title>
  <!--
    Concept: the cairn — the stack of stones a scout leaves where there is no
    signpost, so whoever follows knows someone came this way. Structurally it
    is the truest metaphor for the product: each stone is one logged day, and
    the stack grows as the trip does. The green dot is the stone being placed
    right now.

    Not chosen: three stacked rounded stones read as a database or a layers
    icon at small sizes, and at 16x16 the gaps between stones close up into a
    single blob. The metaphor also needs explaining, and a mark that needs a
    caption is not doing its job.
  -->
  <rect width="360" height="96" fill="#fffaf0" />

  <!-- mark -->
  <g>
    <rect x="0" y="0" width="96" height="96" rx="21" fill="#1e293b" />
    <rect x="26" y="66" width="44" height="15" rx="7.5" fill="#ffd23f" stroke="#1e293b" stroke-width="2.4" />
    <rect x="31" y="48" width="34" height="14" rx="7" fill="#ffd23f" stroke="#1e293b" stroke-width="2.4" />
    <rect x="36" y="32" width="25" height="13" rx="6.5" fill="#fffaf0" stroke="#1e293b" stroke-width="2.4" />
    <circle cx="48" cy="19" r="6.5" fill="#22c55e" stroke="#1e293b" stroke-width="1.8" />
  </g>

  <!-- wordmark -->
  <text
    x="120"
    y="62"
    font-family="Fredoka, 'Trebuchet MS', sans-serif"
    font-size="44"
    font-weight="700"
    fill="#1e293b"
  >Fernscout</text>
</svg>
