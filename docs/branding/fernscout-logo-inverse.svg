<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96">
  <title>Fernscout — logo, inverse (for navy and photographic grounds)</title>
  <!--
    On a dark ground the navy container disappears, so it is dropped entirely
    and the mark is drawn straight onto the surface. Over photography, place the
    lockup on an area darker than navy-700 or add a scrim: the cream trail is
    the element that fails first.
  -->
  <rect width="360" height="96" fill="#1e293b" />
  <g>
    <path d="M18 75 L34 62 L47 57 L63 37 L78 24" fill="none" stroke="#fffaf0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M48 27 L71 50 L48 73 L25 50 Z" fill="#ffd23f" stroke="#1e293b" stroke-width="3" stroke-linejoin="round" />
    <circle cx="78" cy="24" r="6.5" fill="#22c55e" stroke="#1e293b" stroke-width="1.8" />
  </g>
  <text x="120" y="62" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-size="44" font-weight="700" fill="#fffaf0">Fernscout</text>
</svg>
